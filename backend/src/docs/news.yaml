paths:
  /news:
    get:
      summary: Get all news
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          default: 1
        - name: limit
          in: query
          schema:
            type: integer
          default: 5
      responses:
        '200':
          description: Paginated news list
          content:
            application/json:
              example:
                data:
                  - _id: "686d93d720c49a6cbf769ab2"
                    title: "I got a new job"
                    content: "I want to celebrate it next weekend"
                    authorId: "f1a7f290-1762-493c-89b3-8cce436bcc1f"
                    authorFirstname: "user2"
                    authorLastname: "user2"
                    authorProfilePicture: "/uploads/profile/default.png"
                    tags: []
                    published: true
                    images: []
                    likedBy:
                      - "24bc9a0a-585d-4650-ac66-4bfb350d58db"
                    status: "APPROVED"
                    irisCode: "751114409"
                    irisName: "Sainte-Marguerite 9"
                    createdAt: "2025-07-08T21:55:35.447Z"
                    updatedAt: "2025-07-08T21:55:57.377Z"
                    __v: 1
                    id: "686d93d720c49a6cbf769ab2"
                    totalLikes: 1
                total: 1
                page: 1
                lastPage: 1

    post:
      summary: Create a news post
      tags: [News]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/CreateNewsDTO'
      responses:
        '201':
          description: News created successfully
          content:
            application/json:
              example:
                data:
                  - _id: "686d93d720c49a6cbf769ab2"
                    title: "I got a new job"
                    content: "I want to celebrate it next weekend"
                    authorId: "f1a7f290-1762-493c-89b3-8cce436bcc1f"
                    authorFirstname: "user2"
                    authorLastname: "user2"
                    authorProfilePicture: "/uploads/profile/default.png"
                    tags: []
                    published: true
                    images: []
                    likedBy:
                      - "24bc9a0a-585d-4650-ac66-4bfb350d58db"
                    status: "APPROVED"
                    irisCode: "751114409"
                    irisName: "Sainte-Marguerite 9"
                    createdAt: "2025-07-08T21:55:35.447Z"
                    updatedAt: "2025-07-08T21:55:57.377Z"
                    __v: 1
                    id: "686d93d720c49a6cbf769ab2"
                    totalLikes: 1
                total: 1
                page: 1
                lastPage: 1

  /news/upload-images:
    post:
      summary: Upload news images
      tags: [News]
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Images uploaded
          content:
            application/json:
              example:
                urls:
                  - "/uploads/news/file1.png"
                  - "/uploads/news/file2.png"

  /news/pending:
    get:
      summary: Get pending news
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          default: 1
        - name: limit
          in: query
          schema:
            type: integer
          default: 5
      responses:
        '200':
          description: List of pending news
          content:
            application/json:
              example:
                data:
                  - _id: "686d93d720c49a6cbf769ab2"
                    title: "I got a new job"
                    content: "I want to celebrate it next weekend"
                    authorId: "f1a7f290-1762-493c-89b3-8cce436bcc1f"
                    authorFirstname: "user2"
                    authorLastname: "user2"
                    authorProfilePicture: "/uploads/profile/default.png"
                    tags: []
                    published: true
                    images: []
                    likedBy:
                      - "24bc9a0a-585d-4650-ac66-4bfb350d58db"
                    status: "PENDING"
                    irisCode: "751114409"
                    irisName: "Sainte-Marguerite 9"
                    createdAt: "2025-07-08T21:55:35.447Z"
                    updatedAt: "2025-07-08T21:55:57.377Z"
                    __v: 1
                    id: "686d93d720c49a6cbf769ab2"
                    totalLikes: 1
                total: 1
                page: 1
                lastPage: 1

  /news/{id}:
    get:
      summary: Get a specific news post
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: News item
          content:
            application/json:
              example:
                data:
                  - _id: "686d93d720c49a6cbf769ab2"
                    title: "I got a new job"
                    content: "I want to celebrate it next weekend"
                    authorId: "f1a7f290-1762-493c-89b3-8cce436bcc1f"
                    authorFirstname: "user2"
                    authorLastname: "user2"
                    authorProfilePicture: "/uploads/profile/default.png"
                    tags: []
                    published: true
                    images: []
                    likedBy:
                      - "24bc9a0a-585d-4650-ac66-4bfb350d58db"
                    status: "APPROVED"
                    irisCode: "751114409"
                    irisName: "Sainte-Marguerite 9"
                    createdAt: "2025-07-08T21:55:35.447Z"
                    updatedAt: "2025-07-08T21:55:57.377Z"
                    __v: 1
                    id: "686d93d720c49a6cbf769ab2"
                    totalLikes: 1
                total: 1
                page: 1
                lastPage: 1

    patch:
      summary: Update a news post
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/UpdateNewsDTO'
      responses:
        '200':
          description: News updated
          content:
            application/json:
              example:
                data:
                  - _id: "686d93d720c49a6cbf769ab2"
                    title: "I got a new job"
                    content: "I want to celebrate it next weekend"
                    authorId: "f1a7f290-1762-493c-89b3-8cce436bcc1f"
                    authorFirstname: "user2"
                    authorLastname: "user2"
                    authorProfilePicture: "/uploads/profile/default.png"
                    tags: []
                    published: true
                    images: []
                    likedBy:
                      - "24bc9a0a-585d-4650-ac66-4bfb350d58db"
                    status: "APPROVED"
                    irisCode: "751114409"
                    irisName: "Sainte-Marguerite 9"
                    createdAt: "2025-07-08T21:55:35.447Z"
                    updatedAt: "2025-07-08T21:55:57.377Z"
                    __v: 1
                    id: "686d93d720c49a6cbf769ab2"
                    totalLikes: 1
                total: 1
                page: 1
                lastPage: 1

    delete:
      summary: Delete a news post
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: News deleted

  /news/{id}/validate:
    patch:
      summary: Validate or reject a news post
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: './components.yaml#/components/schemas/ValidateNewsDTO'
      responses:
        '200':
          description: News validation updated

  /news/{id}/like:
    post:
      summary: Toggle like on a news post
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Like toggled
          content:
            application/json:
              example:
                liked: true
                totalLikes: 5

  /news/{id}/likes:
    get:
      summary: Get total likes and whether current user liked it
      tags: [News]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Like details
          content:
            application/json:
              example:
                totalLikes: 3
                liked: true
