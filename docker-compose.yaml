services:
  postgres:
    image: postgres:latest
    container_name: postgres_database
    networks:
      - bench-net
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: thebench
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    # ports:
    #   - '8080:8080'
    networks:
      - bench-net
    depends_on:
      - postgres

  mongo:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: thebench_news
    networks:
      - bench-net
    volumes:
      - mongodata:/data/db

  mongo-express:
    image: mongo-express
    container_name: mongo_express
    # ports:
    #   - '8081:8081'  
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
    networks:
      - bench-net
    depends_on:
      - mongo

  backend:
    build: ./backend
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - '3000:3000' 
    networks:
      - bench-net
    depends_on:
      - postgres
      - mongo

  frontend:
    build: ./frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - bench-net
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:

networks:
  bench-net: